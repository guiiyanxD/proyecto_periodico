<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efecto de Revista / Flipbook</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            perspective: 1000px;
        }

        .book-container {
            position: relative;
            width: 600px;
            height: 400px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
        }

        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
            transform-origin: left;
            background-color: #fdfdfd;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            backface-visibility: hidden;
            user-select: none;
        }

        .page.back {
            transform: rotateY(180deg);
        }

        /* Posiciones iniciales de las páginas */
        #page1 {
            left: 50%;
            z-index: 3;
        }

        #page2 {
            left: 50%;
            z-index: 2;
        }

        #page3 {
            left: 50%;
            z-index: 1;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="book-container">
        <!-- Página 1 -->
        <div class="page" id="page1" onclick="nextPage(this)">
            <h1>Portada de la Revista</h1>
            <p>Edición Nº 1 - Octubre 2026</p>
            <small>Haz clic para pasar</small>
        </div>

        <!-- Página 2 -->
        <div class="page" id="page2" onclick="nextPage(this)">
            <h2>Índice / Artículo 1</h2>
            <p>Aquí va el contenido principal del primer artículo de tu revista digital.</p>
        </div>

        <!-- Página 3 -->
        <div class="page" id="page3" onclick="prevPage()">
            <h2>Contraportada</h2>
            <p>¡Gracias por leer nuestra revista!</p>
            <button onclick="resetBook()">Volver al inicio</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevPage()">Anterior</button>
        <button onclick="nextPageManual()">Siguiente</button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 3;

        function nextPage(element) {
            if (currentPage < totalPages) {
                if (element && element.classList.contains('page')) {
                    element.style.transform = 'rotateY(-180deg)';
                }
                currentPage++;
            }
        }

        function nextPageManual() {
            const pageEl = document.getElementById('page' + currentPage);
            if (currentPage < totalPages) {
                pageEl.style.transform = 'rotateY(-180deg)';
                currentPage++;
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                const pageEl = document.getElementById('page' + currentPage);
                pageEl.style.transform = 'rotateY(0deg)';
            }
        }

        function resetBook() {
            for (let i = 1; i < totalPages; i++) {
                document.getElementById('page' + i).style.transform = 'rotateY(0deg)';
            }
            currentPage = 1;
        }
    </script>

</body>

</html>
